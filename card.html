<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .testimonial-card {
        position: relative;
        background: var(--card-bg, #121a1d);
        border-radius: 24px;
        padding: 40px 32px 32px;
        max-width: 460px;
        margin: 60px auto 40px;
    }

    /* Peeche wala offset card */
    .testimonial-card::before {
        content: "";
        position: absolute;
        top: -20px;
        left: 20px;
        right: 20px;
        bottom: -20px;
        background: #1a2427;
        /* thoda lighter shade */
        border-radius: 24px;
        z-index: -1;
    }

    .quote-icon {
        margin-bottom: 20px;
    }

    .testimonial-text {
        color: var(--paragraph-color, #9c9d9b);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 20px;
    }

    .rating {
        display: flex;
        gap: 6px;
        margin-bottom: 30px;
    }

    .client-info {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--card-bg, #121a1d);
        padding: 12px;
        border-radius: 16px;
        position: relative;
        z-index: 2;
    }

    .client-img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
    }

    .client-name {
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .client-location {
        color: var(--paragraph-color, #9c9d9b);
        font-size: 14px;
    }
</style>

<body>
    <div class="testimonial-card">
        <div class="quote-icon">
            <svg width="40" height="32" viewBox="0 0 40 32" fill="none">
                <path
                    d="M0 20.8C0 13.2 2.4 7.2 7.2 2.8C10.4 -0.4 14.4 0 16.4 2.4C18.4 4.8 17.6 8.4 14.8 10C11.6 11.6 10 14 10 17.2C10 19.6 11.6 21.2 14 21.2C17.6 21.2 20 24 20 27.6C20 31.2 17.2 32 13.6 32C6 32 0 27.6 0 20.8Z"
                    fill="#D68240" />
                <path
                    d="M20 20.8C20 13.2 22.4 7.2 27.2 2.8C30.4 -0.4 34.4 0 36.4 2.4C38.4 4.8 37.6 8.4 34.8 10C31.6 11.6 30 14 30 17.2C30 19.6 31.6 21.2 34 21.2C37.6 21.2 40 24 40 27.6C40 31.2 37.2 32 33.6 32C26 32 20 27.6 20 20.8Z"
                    fill="#D68240" />
            </svg>
        </div>
        <p class="testimonial-text">
            From the moment we walked in, everything felt perfect — the food, the ambiance, and the warm service. It's
            not just a meal, it's an experience we keep coming back for. Highly recommended for anyone who loves great
            taste and comfort
        </p>
        <div class="rating">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="#D68240">
                <path
                    d="M8.4375 12.8841L13.6519 16.0312L12.2681 10.0997L16.875 6.10875L10.8084 5.59406L8.4375 0L6.06656 5.59406L0 6.10875L4.60687 10.0997L3.22313 16.0312L8.4375 12.8841Z" />
            </svg>
            <svg width="17" height="17" viewBox="0 0 17 17" fill="#D68240">
                <path
                    d="M8.4375 12.8841L13.6519 16.0312L12.2681 10.0997L16.875 6.10875L10.8084 5.59406L8.4375 0L6.06656 5.59406L0 6.10875L4.60687 10.0997L3.22313 16.0312L8.4375 12.8841Z" />
            </svg>
            <svg width="17" height="17" viewBox="0 0 17 17" fill="#D68240">
                <path
                    d="M8.4375 12.8841L13.6519 16.0312L12.2681 10.0997L16.875 6.10875L10.8084 5.59406L8.4375 0L6.06656 5.59406L0 6.10875L4.60687 10.0997L3.22313 16.0312L8.4375 12.8841Z" />
            </svg>
            <svg width="17" height="17" viewBox="0 0 17 17" fill="#D68240">
                <path
                    d="M8.4375 12.8841L13.6519 16.0312L12.2681 10.0997L16.875 6.10875L10.8084 5.59406L8.4375 0L6.06656 5.59406L0 6.10875L4.60687 10.0997L3.22313 16.0312L8.4375 12.8841Z" />
            </svg>
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="#D68240">
                <path
                    d="M8.4375 12.8841L13.6519 16.0312L12.2681 10.0997L16.875 6.10875L10.8084 5.59406L8.4375 0L6.06656 5.59406L0 6.10875L4.60687 10.0997L3.22313 16.0312L8.4375 12.8841Z" />
            </svg>
        </div>
        <div class="client-info">
            <img src="./assets/client-1.png" alt="Jerome Bell" class="client-img">
            <div class="client-details">
                <h4 class="client-name">Jerome Bell</h4>
                <span class="client-location">New York, USA</span>
            </div>
        </div>
    </div>
</body>

</html>
